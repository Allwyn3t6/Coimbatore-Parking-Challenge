name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-build.yml"

jobs:
  android-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Install Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip -d "$RUNNER_TEMP/godot"
          sudo install "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Install matching Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d "$RUNNER_TEMP/godot-templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Android paths
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Create temporary debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit

      - name: Install Godot Android Gradle build template
        run: |
          mkdir -p android/build
          unzip -q "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip" -d android/build

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/CoimbatoreParkingChallenge-debug.apk
          test -s build/CoimbatoreParkingChallenge-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoimbatoreParkingChallenge-Android-APK
          path: build/CoimbatoreParkingChallenge-debug.apk
          if-no-files-found: error
          retention-days: 14
